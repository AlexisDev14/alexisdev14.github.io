<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan — modèle</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  canvas { display: block; margin: 0 auto; height: 100vh; width: auto; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="timeline.js"></script>
<script>
const W = 1080, H = 1920, FPS = 30, DURATION = 10, FRAMES = FPS * DURATION;
const TAU = Math.PI * 2;
const mainCtx = document.getElementById('c').getContext('2d');
let ctx = mainCtx;
const params = new URLSearchParams(location.search);

// ---------- Palette A (même direction artistique que les plans 1 et 2) ----------
const P = {
  ink: '#1B2340', blue: '#326DEC', blueLight: '#6E97F2', pink: '#EC4899', parch: '#F3DAB4',
  facades: ['#FBEBD3', '#F8E3C6', '#FCEFDD'], facadeShade: '#EED6B0', stoneLine: 'rgba(27,35,64,0.16)',
  zinc: '#7D8FB3', zincDark: '#5F7299', window: '#1B2340', lit: '#FFD27A', mullion: 'rgba(243,218,180,0.55)',
  pave: '#EBD1A8', paveLine: 'rgba(27,35,64,0.2)', curb: '#D2B288', gutter: '#9AAAC8', road: '#D6B78C', cobble: '#E6CBA1',
  wood: '#C98E4A', woodDark: '#A9713A', woodDeep: '#8C5A2E', brass: '#E2AE5C', brassDark: '#B9853C',
  skin: '#EDBE92', skinDark: '#D9A174', steel: '#9AAAC8', paper: '#FFF4E2', paperBack: '#EEDDC0', paperShade: '#E2CBA6',
  far: '#E9CFA6', farInk: 'rgba(27,35,64,0.38)', cloud: '#FBEBD3', mist: '#FFF4E2',
  wall: '#F0D5AC', wallStripe: '#E9CB9E', wainscot: '#E0BC8A',
  coat: '#26315A', coatLight: '#36457A', silver: '#DDE4F1', silverDark: '#A9B7D3',
  beard: '#8F7D6B', beardLight: '#B5A592', beardDark: '#76655A', hair: '#9A8877',
  wax: '#D6337A', waxLight: '#F27DB4', pad: '#2E4D9E', gold: '#E8B866',
  curtain: '#EC4899', curtainDark: '#C2307A',
};
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',')})`; };
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rand = mulberry32(1883);
const rr = (a, b) => a + (b - a) * rand();
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOut = (t) => { t = clamp(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const easeOut = (t) => 1 - Math.pow(1 - clamp(t), 3);
const smooth = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
function spring(t, zeta = 0.5, omega = 14) {
  if (t <= 0) return 0;
  const wd = omega * Math.sqrt(1 - zeta * zeta);
  return 1 - Math.exp(-zeta * omega * t) * (Math.cos(wd * t) + (zeta * omega / wd) * Math.sin(wd * t));
}
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function inked(fill, lw = 6) {
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  ctx.lineWidth = lw; ctx.strokeStyle = P.ink; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
}
// trait épais cerné d'encre
function inkLine(pts, lw, col, out = 7) {
  for (const [w, c] of [[lw + out, P.ink], [lw, col]]) {
    ctx.beginPath(); ctx.moveTo(...pts[0]); for (let i = 1; i < pts.length; i++) ctx.lineTo(...pts[i]);
    ctx.lineWidth = w; ctx.strokeStyle = c; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
  }
}

// ---------- Grain papier ----------
const grain = document.createElement('canvas'); grain.width = W; grain.height = H;
{
  const g = grain.getContext('2d'), img = g.createImageData(W, H);
  for (let i = 0; i < img.data.length; i += 4) { const v = 255 - Math.floor(Math.pow(rand(), 3) * 70); img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0);
  g.globalAlpha = 0.08; g.strokeStyle = '#000';
  for (let i = 0; i < 1400; i++) { const x = rand() * W, y = rand() * H, a = rand() * TAU, l = rr(6, 22); g.lineWidth = rr(0.4, 1.1); g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
}

// =====================================================================
// SCÈNE DU PLAN — à remplacer. Repère écran 1080 × 1920, t en secondes.
// Zone d'action sûre TikTok : x 60–930, y 150–1430.
// =====================================================================
const smoothstep = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const burst = (t, t0, amp, f = 7, k = 6) => (t < t0 ? 0 : amp * Math.sin(TAU * f * (t - t0)) * Math.exp(-k * (t - t0)));

function drawScene(t) {
  ctx.fillStyle = P.parch; ctx.fillRect(0, 0, W, H);
  // exemple : un objet qui « pop » à 1 s avec un ressort
  const s = spring(t - 1, 0.4, 14);
  ctx.save(); ctx.translate(540, 900); ctx.scale(s, s);
  rrect(-140, -180, 280, 360, 24); inked(P.blue, 7);
  ctx.restore();
}

function setFrame(frame) {
  const t = frame / FPS;
  ctx = mainCtx; ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawScene(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = 0.32;
  ctx.drawImage(grain, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}

window.W = W; window.H = H; window.FRAMES = FRAMES; window.FPS = FPS;
window.renderFrame = (f) => { setFrame(f); return true; };
if (params.has('frame')) setFrame(+params.get('frame'));
else if (!navigator.webdriver) { const t0 = performance.now(); const loop = () => { setFrame(Math.floor((performance.now() - t0) / 1000 * FPS) % FRAMES); requestAnimationFrame(loop); }; loop(); }
window.READY = true;
</script>
</body>
</html>
